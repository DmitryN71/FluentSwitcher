# Builds FluentSwitcher on every push; a version tag (v1.0.0) also makes a GitHub release with the installer and
# the zip. The same scripts as on a developer's PC: build.cmd (MSVC, CMake, Ninja; wxWidgets is downloaded) and
# tools\make_release.ps1 (zip + Inno Setup installer; Inno Setup 6 is on the Windows runners).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Zip and installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\make_release.ps1 -NoBuild

      - uses: actions/upload-artifact@v7
        with:
          name: FluentSwitcher
          path: |
            build/release/*.zip
            build/release/*-setup.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem build/release -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-setup.exe' }
          gh release create "${{ github.ref_name }}" $files.FullName --title "FluentSwitcher ${{ github.ref_name }}" --generate-notes
